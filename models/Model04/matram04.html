<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Car Visualization</title>
    <link rel="stylesheet" href="../../css/main.css">
    <link rel="icon" type="image/png" href="../../img/matram.png">
</head>

<body>
    <h1>Car Movement + buildings + people</h1>

    <div class="container">
        <canvas id="nodeCanvas" width="600" height="600"></canvas>
        <div id="step">Step:</div>
    </div>

    <button onclick="play()">Start</button>
    <button onclick="stop()">Stop</button>
    

    <script type="module">
        var worker = null;
        var step = 8726;
        var stepLable = null;

        window.play = function play() {
            worker.postMessage({
                type: "play",
            })

        }

        window.stop = function stop() {
            worker.postMessage({
                type: "stop",
            })

        }


        function showStep(step) {
            stepLable.innerHTML= `Step: ${step}`;
        }



        function init() {
            const canvas = document.getElementById("nodeCanvas");
            stepLable = document.getElementById("step");
            const offscreen = canvas.transferControlToOffscreen();
            const rect = canvas.getBoundingClientRect();
            worker = new Worker("./js/worker.js", { type: "module" });
            console.log("here");
            worker.onerror = function (error) {
                console.error("Worker error:", error);
                console.error("Message:", error.message);
                console.error("Filename:", error.filename);
                console.error("Line:", error.lineno);
            };
            worker.postMessage(
                {
                    type: "init",
                    canvas: offscreen,
                    desiredWidth: Math.round(rect.width),
                    desiredHeight: Math.round(rect.height),
                    nodeFile: "../../../data/static/node_list.csv",
                    edgeFile: "../../../data/static/link_list.csv",
                    carsFile: "../../../data/dynamic/cars_xy_compact.csv",
                    pedestrianFile: "../../../data/dynamic/pedestrians_xy_compact.csv",
                    buildingFile: "../../../data/static/building_list.csv",
                    houseFile: "../../../data/static/house_list.csv",
                },
                [offscreen],
            );

            worker.onmessage = function (e) {
                switch (e.data.type) {
                    case "step":
                        showStep(e.data.step);
                        break;
                }
            }

        }
        document.addEventListener("DOMContentLoaded", init);
    </script>
</body>

</html>
